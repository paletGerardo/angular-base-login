<div class="container lg:container xl:container bg_image" >
  <h1 id="seguros">Seguros</h1>
  <div class="container mx-auto py-4 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-3 xl:grid-cols-3 gap-4">
  
    <ng-container *ngFor="let product of products$ | async">
        <app-product-card *ngIf="product.id_negocio===1" class="centrar" [product]="product"  (click)="productDetail(product)"></app-product-card>
      </ng-container>
    </div>
    <h1  id="asistencias">Asistencias</h1>
    <div class="container mx-auto py-4 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-3 xl:grid-cols-3 gap-4">
      <ng-container *ngFor="let product of products$ | async">
        <app-product-card *ngIf="product.id_negocio===2" class="centrar" [product]="product"  (click)="productDetail(product)"></app-product-card>
      </ng-container>
    </div>
  </div>
