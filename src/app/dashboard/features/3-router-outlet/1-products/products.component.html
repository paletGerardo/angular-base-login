<div class="container lg:container xl:container">
  <img
    src="https://www.bancodeserviciosfinancieros.com.ar/wp-content/uploads/2022/08/seguros-y-asistencias-300x167.png?x54589"
    class="icono py-4" alt="">
  <h1 id="seguros">Seguros</h1>
  <div class="container mx-auto py-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    <ng-container *ngFor="let product of products$ | async">
      <app-product-card *ngIf="product.id_negocio===1" class="centrar" [product]="product"></app-product-card>
    </ng-container>
  </div>
  <img
    src="https://www.bancodeserviciosfinancieros.com.ar/wp-content/uploads/2022/08/seguros-y-asistencias-300x167.png?x54589"
    class="icono py-4" alt="">
  <h1 id="asistencias">Asistencias</h1>
  <div class="container mx-auto py-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    <ng-container *ngFor="let product of products$ | async">
      <app-product-card *ngIf="product.id_negocio===2" class="centrar" [product]="product"></app-product-card>
    </ng-container>
  </div>
</div>
