<div class="flex flex-col justify-center items-center card overflow-hidden rounded-lg shadow-[0_25px_20px_-15px_rgba(0,0,0,0.3)] p-3 bg-white">
  <img *ngIf="!notImage" class="w-full rounded-lg shadow-[0_25px_30px_-20px_rgba(0,0,0,0.4)]"
       [src]="this.url" alt="products"/>
  <img *ngIf="notImage" class="w-full rounded-lg shadow-[0_25px_30px_-20px_rgba(0,0,0,0.4)]"
       src="../../../../../../../assets/images/not_product.jpeg" alt="Mountain"/>
  <div class="px-1 py-4">
    <div class="text-gray-700 text-base">
      <ng-container *ngFor="let plan of product.planes; index as i">
        <ng-container *ngIf="i == 0">
          <ng-container *ngFor="let rango of plan.rangos; index as j">
            <ng-container *ngIf="j == 0">
              <small   style="font-weight:bolder">Desde</small><br>
              <span  style="font-weight:bolder">$ {{rango.precio}}</span> <small  style="font-weight:bolder"> por mes</small><br>
              <small [ngStyle]="{'color': secondaryColor }" style=" font-style: italic;">{{slogan}}</small><br>
              <app-button-primary
                (clicked)="verDetalleProducto(product.id_producto.toString())"
                [text]="'ver mas'"
                [bgcolor]="bgcolor"
              >
              </app-button-primary>
            </ng-container>
          </ng-container>
        </ng-container>
      </ng-container>
    </div>
  </div>
</div>
