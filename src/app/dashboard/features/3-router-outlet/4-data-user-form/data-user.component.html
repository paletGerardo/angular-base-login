
<div style="display: flex;justify-content: center;">
  <div>
<!--    [FER]: paso 3 - recibir datos del titular-->
    <app-personal-data [id]="id" (sendPersonalData)="savePersonalData($event)" [type] = "'TITULAR"></app-personal-data>

    <app-question *ngIf="isAddresQuestion" (respuesta)="validarRespuesta($event)" [question]="'Es domicilpo asegurado'" [type] = "'DOMICILIO" style="display:flex;justify-content:center;padding:6vh"></app-question>
    <app-addres.form *ngIf="isAddresQuestion"></app-addres.form>

    <app-question *ngIf="isBeneficxiaru" (respuesta)="validarRespuesta($event)" [question]="'Es domicilpo asegurado'" style="display:flex;justify-content:center;padding:6vh"></app-question>
    <app-personal-data *ngIf="showFormBewneficiary" (sendBeneficiary)="savePersonalData($event)" [type] = "'BENEFICIARIO"></app-personal-data>

    <app-question *ngIf="isAditional" (respuesta)="validarRespuesta($event)" [question]="'desea agregar una adicional'" style="display:flex;justify-content:center;padding:6vh"></app-question>
    <app-personal-data *ngIf="showFormBAditional" (sendAditional)="savePersonalData($event)" [type] = "'ADICIONAL"></app-personal-data>
  </div>
</div>
