<div class="max-w-screen-md mx-auto p-5">
    <div style="padding:6vh;">
      <h2 style="text-align:center;">Domicilio</h2>
    </div>
    <form [formGroup]="addressDataForm" class="w-full max-w-lg" style="display: contents;" (ngSubmit)="guardarDatos()">
  
      <div class="flex flex-wrap mb-4">
        <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-first-name">
            Calle
          </label>
          <input
            class="appearance-none block w-full  bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
            id="grid-first-name" type="text" formControlName="address" style="text-transform: capitalize;">
          <div *ngFor="let validation of validationMessages.address!">
            <span style="color:red;"
                  *ngIf="getValidationAdressFromControl(validation, 'address')"> {{ validation.message }} </span>
          </div>
        </div>
        <div class="w-full md:w-1/6 px-3">
          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-last-name">
            Nro/Piso
          </label>
          <input
            class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
            id="grid-last-name" type="text" formControlName="number">
          <div *ngFor="let validation of validationMessages.number!">
            <span style="color:red;"
                  *ngIf="getValidationAdressFromControl(validation, 'number')"> {{ validation.message }} </span>
          </div>
        </div>
        <div class="w-full md:w-1/3 px-3 mb-6 md:mb-0">
          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-city">
            Localidad
          </label>
          <input
            class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
            id="grid-city" type="text" formControlName="city" style="text-transform: capitalize;">
          <div *ngFor="let validation of validationMessages.city!">
            <span style="color:red;"
                  *ngIf="getValidationAdressFromControl(validation, 'city')"> {{ validation.message }} </span>
          </div>
        </div>
      </div>
  
      <div class="flex flex-wrap  mb-4">
        <div class="w-full md:w-1/3 px-3 mb-6 md:mb-0">
          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-city">
            Provincia
          </label>
          <select formControlName="province"
                  class="bg-gray-200 border  text-gray-700 border-gray-200 rounded py-3 px-4  text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
            <option _ngcontent-bdm-c114="" value="" disabled>Seleccione provincia</option>
            <option *ngFor="let prov of provinces" [ngValue]="prov.name">{{prov.name}} </option>
          </select>
  
  
          <div *ngFor="let validation of validationMessages.province!">
            <span style="color:red;"
                  *ngIf="getValidationAdressFromControl(validation, 'province')"> {{ validation.message }} </span>
          </div>
        </div>
        <div class="w-full md:w-1/6 px-3 mb-6 md:mb-0">
          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-state">
            C.postal
          </label>
          <input
            class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
            id="grid-city" type="text" formControlName="zip">
          <div *ngFor="let validation of validationMessages.zip!">
            <span style="color:red;"
                  *ngIf="getValidationAdressFromControl(validation, 'zip')"> {{ validation.message }} </span>
          </div>
        </div>
        <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-state">
            Email
          </label>
          <input
            class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
            id="grid-city" type="text" formControlName="email">
          <div *ngFor="let validation of validationMessages.email!">
            <span style="color:red;"
                  *ngIf="getValidationAdressFromControl(validation, 'email')"> {{ validation.message }} </span>
          </div>
        </div>
      </div>
      <div class="flex flex-wrap  mb-4">
  
        <div class="w-full md:w-1/4 px-3">
          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-last-name">
            Cod area
          </label>
          <input
            class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
            id="grid-last-name" type="text" formControlName="cod_area" maxlength="4">
  
          <div *ngFor="let validation of validationMessages.cod_area!">
            <span style="color:red;"
                  *ngIf="getValidationAdressFromControl(validation, 'cod_area')"> {{ validation.message }} </span>
          </div>
        </div>
        <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-first-name">
            Nro telefono
          </label>
          <input
            class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
            id="grid-first-name" type="tel" maxlength="4" formControlName="number_phone">
          <div *ngFor="let validation of validationMessages.number_phone!">
            <span style="color:red;"
                  *ngIf="getValidationAdressFromControl(validation, 'number_phone')"> {{ validation.message }} </span>
          </div>
        </div>
  
      </div>
      <div style="display:flex;justify-content:end;">
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full">
          Siguiente
        </button>
      </div>
    </form>
  </div>
