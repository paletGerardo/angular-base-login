<div style="padding:10vh">

    <div class="flex px-4 py-2 flex-wrap justify-center items-baseline">
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full" (click)="irPlandePago()" >
            SI
          </button>
          <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full" (click)="otherAddress()"  >
            NO
          </button>
    </div>
</div>
