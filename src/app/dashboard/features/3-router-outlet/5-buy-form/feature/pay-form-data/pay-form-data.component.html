<div class="max-w-screen-md mx-auto p-5" id="formPrincipal">
  <div style="padding-top:10vh;">
    <h2 style="text-align:center;">Formulario de pago</h2>
  </div>
  <app-cards-svg></app-cards-svg>

  <form [formGroup]="payDataForm" class="w-full max-w-lg" style="display: contents;" (ngSubmit)="guardar()">

    <div class="flex flex-wrap mb-4">
      <div class="w-full  px-3 mb-6 md:mb-0">
        <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-first-name">
          Número de tarjeta
        </label>
        <input
          class="appearance-none block w-full  bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
          id="grid-first-name" type="text" formControlName="number_card" min="01-2023" max="12-2030">
        <div *ngFor="let validation of validationMessages.number_card!">
          <span style="color:red;" *ngIf="getValidationPayFormControl(validation, 'number_card')"> {{ validation.message
            }} </span>
        </div>
      </div>
    </div>

    <div class="flex flex-wrap  mb-4">

      <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">

        <label  class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-state">Fecha de expiración</label>
        <input
        class="appearance-none block w-full  bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
 
        type="text"  maxlength="5" placeholder="MM/YY" 
          name="month" [(ngModel)]="month"  formControlName="expiration" (keyup)="addSlash($event)" (keydown)="clearData($event)" [min]="01/20" [max]="12/30">
        <!--<input
            class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
            id="grid-city" type="text"  [textMask]="mask"  [min]="01/2023" formControlName="expiration">-->
        <div *ngFor="let validation of validationMessages.expiration!">
          <span style="color:red;" *ngIf="getValidationPayFormControl(validation, 'expiration')"> {{ validation.message
            }} </span>
        </div>
      </div>
      <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
        <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-state">
          Cod. Seguridad
        </label>
        <input
          class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
          id="grid-city" type="text" formControlName="security_code">
        <div *ngFor="let validation of validationMessages.security_code!">
          <span style="color:red;" *ngIf="getValidationPayFormControl(validation, 'security_code')"> {{
            validation.message }} </span>
        </div>
      </div>
    </div>
    <div class="flex flex-wrap  mb-4">


      <div class="w-full  px-3 mb-6 md:mb-0">
        <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-first-name">
          Titular de la tarjeta
        </label>
        <input
          class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
          id="grid-first-name" type="tel" formControlName="cardholder" style="text-transform: capitalize;">
        <div *ngFor="let validation of validationMessages.cardholder!">
          <span style="color:red;" *ngIf="getValidationPayFormControl(validation, 'cardholder')"> {{ validation.message
            }} </span>
        </div>
      </div>

    </div>
    <div class="flex px-4 py-2 flex-wrap justify-center items-baseline">
      <!--  <app-button-primary  (click)="volver()"></app-button-primary>-->

      <app-button-primary [text]="text"></app-button-primary>
    </div>
    <!--<div style="display:flex;justify-content:end;">
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full" >
          Siguiente
        </button>
      </div>-->
  </form>
</div>
