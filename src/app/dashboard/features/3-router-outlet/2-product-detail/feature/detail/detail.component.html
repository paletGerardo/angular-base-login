<div class="details">
  <p class="price"> <span class="pl-1 font-bold">$ {{this.price}} </span> <span> por més </span></p>
  <div class="">
    <div *ngFor="let item of itemsArray" class="flex items-center py-2">
      <span class="iconify mr-2" data-icon="akar-icons:circle-check-fill" style="color: #0fa958;"></span>
      <p class="text-xs">{{item}}</p>
    </div>

    <div class="grid grid-cols-3 gap-4">
      <div class="flex flex-col items-center">
        <p class="font-bold text-center text-xs lg:text-sm">¿tenes dudas?</p>
        <span class="iconify" data-icon="et:phone" style="font-size: 36px;"></span>
      </div>
      <div class="grid grid-rows-2 gap-1 col-span-2">
        <p class="font-bold text-center">Comunicate al 0800-122-0074</p>
        <p class="font-bold text-center">De Lunes a Viernes de 9 a 21hs </p>
      </div>
    </div>
  </div>
</div>
