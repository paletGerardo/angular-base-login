<div class="plans" [ngStyle]="{'background-color': primaryColor }">
  <p class="text-center px-4">¡Elegí el plan que más se adapte a tus necesidades!</p>
<div class="fixed-size-container flex justify-center grid grid-cols-3 gap-4 p-6">
   <ng-container *ngFor="let plan of plansObs | async ;let i=index">
    <app-button-secondary
      class="fixed-size flex justify-center btn btn-primary"
      [text]="plan.codigo_plan"
      [cupon]="cupon"
      (click)="emitSelected(plan, i)"
       [active]="plan.active"
       style="max-width: 105px;">
    </app-button-secondary>
  </ng-container>
</div>
</div>
