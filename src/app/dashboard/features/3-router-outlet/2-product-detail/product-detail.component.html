<div class="container pt-8">
  <section class="container py-8" id="title">
    <h2 class="product_detail_title py-4">Seguro de {{titulo}}</h2>
    <div class="product_detail_slogan pb-4">
      <p [ngStyle]="{'color': primaryColor }">
        Asegurá tu celular para usarlo sin preocuparte en cualquier lugar
      </p>
    </div>
    <div class="detail-container">
      <div class="flex justify-center lg:col-span-2 w-full bg-cover rounded animate__animated animate__fadeInLeft bg-white pr-porcentaje-35">
        <!-- colored -->
        <div class="ih-item circle colored effect3 left_to_right" >
          <a href="#">
            <div class="img"><img [src]="this.url" alt="img"></div>
            <div class="info" [ngStyle]="{'background-color': primaryColor }">
              <h3>
                <small>desde</small>
                ${{precio}}
                <small>por mes</small>
              </h3>
              <p class="show_if_not_cell">clic para</p>
              <b class="show_if_not_cell">¡Adquirir!</b>
            </div>
          </a>
        </div>
      </div>
      <div class="flex justify-center col-span-2 grid grid-rows-4 gap-4 bg-white m-t-4">
        <app-plan-list *ngIf="primaryColor" [plans]="plans" (emitPlanSelected)="showRisk($event)"></app-plan-list>
        <app-risk-list [riskCopia]="riskCopia" [risks]="risks"></app-risk-list>
<!--        <app-detail [price]="precio" [itemsArray]="itemsArray"></app-detail>-->
        <app-button-primary (click)="comprarProducto()"></app-button-primary>
      </div>
    </div>
  </section>

  <section class="py-8 px-4">
