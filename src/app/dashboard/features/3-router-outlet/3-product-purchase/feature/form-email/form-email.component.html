<div>
    <h3>Email donde recibirás notificaciones y documentación</h3>
   
      <form  [formGroup]="userEmail" class=" max-w-sm" (ngSubmit)="guardar()">
          <div class="flex items-center border-b border-green-500 py-2">
            <input type="email" formControlName="Email" [(ngModel)]="emailUser"
            class="appearance-none bg-transparent border-none w-full text-gray-700 mr-3 py-1 px-2 leading-tight focus:outline-none" placeholder="federicomrusco@gmail.com" aria-label="Full name">     
          <app-button-secondary  [cupon]="cupon" [text]="text"></app-button-secondary>         
          </div>
        </form>
      
</div>
