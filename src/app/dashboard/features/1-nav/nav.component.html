<!--<template>-->
<nav id="nav" class="fixed w-full z-50 animate__animated animate__fadeInDown"
     [ngStyle]="{'background-color': bgColor }" (scroll)="onScroll($event)">
  <div class="container mx-auto px-2 sm:px-6 lg:px-8">
    <div class="relative flex h-16 items-center justify-between">
      <div class="absolute inset-y-0 left-0 flex items-center">
        <!-- Mobile menu button-->
        <button buttonDirective (click)="showMenuButton = !showMenuButton"
                class="inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white"
                aria-controls="mobile-menu" aria-expanded="false">
          <span class="sr-only">Open main menu</span>
          <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
          </svg>
          <svg class="hidden h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="flex flex-1">
        <div class="inset-y-0 left-0 flex items-center">
          <!-- Mobile menu button-->
          <button type="button"
                  class="inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-gray-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white"
                  aria-controls="mobile-menu" aria-expanded="false">
            <span class="sr-only">Open main menu</span>
            <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
            </svg>
            <svg class="hidden h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="flex md:flex-shrink-0 items-center w-full justify-center md:justify-start"
             *ngIf="partnerTheme && partnerTheme.url_logo">
          <!--          <img class="block h-8 w-auto lg:hidden" src="https://tailwindui.com/img/logos/mark.svg?color=indigo&shade=500" alt="Your Company">-->
          <img *ngIf="!clicked" class="iconoWeb hidden h-8 w-auto md:block" [src]="partnerTheme.url_logo"
               alt="Your Company">
          <input class="inputSearch flex justify-center sm:ml-4 h-8 lg:w-96 sm:w-42 rounded" type="text">

          <div>
            <input *ngIf="clicked" type="text" class="input">
            <mat-icon class="icon" (click)="showInput()">search</mat-icon>

          </div>


        </div>
      </div>
      <!--Social icons-->
      <div
        class="hidden md:block absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">
        <button type="button"
                class="rounded-full text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800"
                [ngClass]="{'bg-opacity-100': !backGroundClass, 'bg-opacity-80' : backGroundClass}">
          <span class="sr-only">View notifications</span>
          <img class="h-8 w-8 mr-3 " src="../../../../assets/icons/face-icon.png" alt="face">
        </button>
        <button type="button"
                class="rounded-full text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800"
                [ngClass]="{'bg-opacity-100': !backGroundClass}">
          <span class="sr-only">View notifications</span>
          <img class="h-8" src="../../../../assets/icons/twiter-icon.png" alt="twit">
        </button>

      </div>
    </div>
  </div>

  <!-- Mobile menu, show/hide based on menu state. -->
  <div [ngClass]="{'hidden-app': !showMenuButton}" id="mobile-menu" class="z-50">
    <div class="mx-auto container px-2 sm:px-6 lg:px-8">
      <div class="w-auto flex items-center py-2" *ngIf="partnerTheme && partnerTheme.url_logo">
        <img class="iconoMobile md:hidden h-8 w-auto" [src]="partnerTheme.url_logo" alt="Your Company">
      </div>
      <a routerLink="/dashboard/home"
         class="animate__animated animate__fadeInRight animate__delay-1s text-gray-300 hover:bg-gray-700 hover:text-white block px-3 py-2 rounded-md text-base font-medium"
         aria-current="page">
        Home
      </a>
      <a routerLink="/dashboard/home"
         class="animate__animated animate__fadeInRight animate__delay-1s text-gray-300 hover:bg-gray-700 hover:text-white block px-3 py-2 rounded-md text-base font-medium"
         aria-current="page" (click)="scrollCall('seguros')">
        Seguros
      </a>
      <a routerLink="/dashboard/home" data-bs-target="#navbarNavDropdown" data-bs-toggle="collapse"
         class="animate__animated animate__fadeInRight animate__delay-1s text-gray-300 hover:bg-gray-700 hover:text-white block px-3 py-2 rounded-md text-base font-medium"
         aria-current="page" (click)="scrollCall('asistencias')">
        Asistencias
      </a>
      <a routerLink="/dashboard/how-to-buy"
         class="animate__animated animate__fadeInRight animate__delay-2s text-gray-300 hover:bg-gray-700 hover:text-white block px-3 py-2 rounded-md text-base font-medium"
         aria-current="page">
        Como comprar
      </a>
<!--      <a routerLink="/dashboard/about"-->
<!--         class="animate__animated animate__fadeInRight animate__delay-2s text-gray-300 hover:bg-gray-700 hover:text-white block px-3 py-2 rounded-md text-base font-medium"-->
<!--         aria-current="page">-->
<!--        Nosotros-->
<!--      </a>-->
      <a href="https://autogestion.cardif.com.ar/#/login" target="_blank"
         class="animate__animated animate__fadeInRight animate__delay-3s text-gray-300 hover:bg-gray-700 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Consultá
        tu póliza
      </a>
      <a href="https://impresioncertificados.cardif.com.ar/consulta-web/load.action" target="_blank"
         class="animate__animated animate__fadeInRight animate__delay-4s text-gray-300 hover:bg-gray-700 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Descargá
        tu póliza
      </a>

      <!--Social icons mobil-->
      <div class=" md:hidden gap-1 flex p-2">
        <button type="button"
                class="rounded-full p-1 text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800"
                [ngClass]="{'bg-opacity-100': !backGroundClass, 'bg-opacity-80' : backGroundClass}">
          <span class="sr-only">View notifications</span>
          <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
               preserveAspectRatio="xMidYMid meet" viewBox="0 0 24 24">
            <path fill="currentColor" fill-rule="evenodd"
                  d="M0 12.067C0 18.033 4.333 22.994 10 24v-8.667H7V12h3V9.333c0-3 1.933-4.666 4.667-4.666c.866 0 1.8.133 2.666.266V8H15.8c-1.467 0-1.8.733-1.8 1.667V12h3.2l-.533 3.333H14V24c5.667-1.006 10-5.966 10-11.933C24 5.43 18.6 0 12 0S0 5.43 0 12.067Z"

          </svg>
        </button>
        <button type="button"
                class="rounded-full bg-gray-800 p-1 text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800"
                [ngClass]="{'bg-opacity-100': !backGroundClass}">
          <span class="sr-only">View notifications</span>
          <svg class="h-7 w-7" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
               preserveAspectRatio="xMidYMid meet" viewBox="0 0 1024 1024">
            <path fill="currentColor"

          </svg>

        <button type="button"
                class="rounded-full bg-gray-800 p-1 text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800"
                [ngClass]="{'bg-opacity-100': !backGroundClass, 'bg-opacity-80' : backGroundClass}">
          <span class="sr-only">View notifications</span>
          <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
               stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</nav>
