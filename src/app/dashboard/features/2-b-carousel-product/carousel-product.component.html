<swiper [effect]="'cards'" [grabCursor]="true" class="swiperCard">
  <ng-template swiperSlide *ngFor="let product of products$ | async">
    <app-product-card [product]="product"  (click)="productDetail(product)"></app-product-card>
  </ng-template>
</swiper>

<swiper
  [slidesPerView]="4"
  [spaceBetween]="20"
  [slidesPerGroup]="3"
  [loop]="true"
  [loopFillGroupWithBlank]="true"
  [pagination]="{
      clickable: true
    }"
  [navigation]="true"
  class="mySwiper"
>
  <ng-template swiperSlide *ngFor="let product of products$ | async">
    <app-product-card [product]="product"  (click)="productDetail(product)"></app-product-card>
  </ng-template>
</swiper>
