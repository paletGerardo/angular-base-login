<swiper
  [effect]="'cards'"
  [grabCursor]="true"
  [autoplay]= "{
    delay: 3000
  }"
  class="swiperCard">
  <ng-template swiperSlide *ngFor="let product of products$ | async">
    <app-product-card [product]="product"  (click)="productDetail(product)"></app-product-card>
  </ng-template>
</swiper>

<swiper
  [slidesPerView]="5"
  [spaceBetween]="10"
  [slidesPerGroup]="2"
  [loop]="true"
  [loopFillGroupWithBlank]="true"
  [pagination]="{
      clickable: true
    }"
  [autoplay]= "{
    delay: 3000
  }"
  [navigation]="true"
  class="mySwiper"
>
  <ng-template swiperSlide *ngFor="let product of products$ | async">
    <app-product-card [product]="product"  (click)="productDetail(product)"></app-product-card>
  </ng-template>
</swiper>
