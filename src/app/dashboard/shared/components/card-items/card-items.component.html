<div class="flex justify-center">
  <div class="card flex" *ngIf="MODEL == 'MODEL-1'">
    <div class="card-num" [ngStyle]="{'background-color': bgColor}">{{titulo}}</div>
    <div class="card-icon flex justify-center items-center">{{icon}}</div>
    <div class="card-body flex items-center">{{body}}</div>
  </div>

  <div class="card flex py-2" *ngIf="MODEL == 'MODEL-2'">
    <div class="card2-icon" [ngStyle]="{'background-color': bgColor}">
      <img [src]="icon">
    </div>
    <div class="card2-body flex items-center font-bold" [ngStyle]="{'color': textColor}">{{body}}</div>
  </div>
</div>
