<div *ngIf="beneficiario">
    <h2 style="text-align: center;">¿Desea agregar beneficiarios?</h2>
    <div style="display: flex;justify-content: center;">
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full" >
            SI
          </button>
          <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full"  (click)="otherAddress()">
            NO
          </button>
    </div>
</div>
<div *ngIf="domicilio">
    <h2 style="text-align: center;">¿El domicilio que vas a asegurar es el mismo que fue declarado?</h2>
    <div style="display: flex;justify-content: center;">
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full" >
         SI
       </button>
       <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full" (click)="otherAddress()">
         NO
       </button>
    </div>
</div>
